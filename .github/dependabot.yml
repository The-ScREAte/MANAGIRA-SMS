# Weekly checks for package updates with security fixes.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/mira"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
