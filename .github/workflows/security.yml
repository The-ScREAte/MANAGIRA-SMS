name: Security checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Dependency audit (fails on critical)
        run: npm audit --omit=dev --audit-level=critical

      - name: Syntax check of security modules
        run: |
          node --check middleware/securityMiddleware.js
          node --check utils/authRateLimit.js
          node --check utils/sessionRevoke.js
          node --check utils/uploadSafety.js
          node --check utils/dbLock.js
