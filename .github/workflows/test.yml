name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Check package-lock.json matches package.json
        run: node scripts/check-lockfile.js

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test